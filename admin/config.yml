backend:
  name: github
  repo: TUUSUARIO/TUREPO
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "contenido"
    label: "Contenido principal"
    files:
      - file: "content/content.json"
        label: "Contenido principal"
        name: "contenido_principal"
        format: "json"
        fields:
          - label: "Texto de bienvenida"
            name: "textoentrada"
            widget: "text"
          - label: "Foto del autor"
            name: "imagenautor"
            widget: "image"
