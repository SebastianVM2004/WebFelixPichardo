backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/static/images"

publish_mode: editorial_workflow

collections:

  # ==========================================
  # ARTÍCULOS
  # ==========================================
  - name: "posts"
    label: "Artículos"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - { label: "Resumen", name: "summary", widget: "text", required: false }
      - { label: "Imagen destacada", name: "thumbnail", widget: "image", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }

  # ==========================================
  # PÁGINA PRINCIPAL
  # ==========================================
  - label: "Página principal"
    name: "homepage"

    files:

      - label: "Contenido de inicio"
        name: "homepage"
        file: "content/content.json"

        fields:

          - label: "Título del sitio"
            name: "siteTitle"
            widget: "string"

          - label: "Texto de bienvenida"
            name: "textoentrada"
            widget: "markdown"

          - label: "Imagen del autor"
            name: "imagenautor"
            widget: "image"
            required: false

          - { label: "Título del libro destacado", name: "bookHeading", widget: "string" }
          - { label: "Descripción del libro", name: "bookDescription", widget: "text" }
          - { label: "Título del autor", name: "authorHeading", widget: "string" }
          - { label: "Nombre del autor", name: "authorName", widget: "string" }
          - { label: "Descripción del autor", name: "authorDescription", widget: "text" }
          - { label: "Servicios del autor", name: "authorServices", widget: "text" }
          - { label: "Título de eventos", name: "eventsHeading", widget: "string" }
          - { label: "Descripción de eventos", name: "eventsDescription", widget: "text" }
          - { label: "Evento 1 - título", name: "event1Title", widget: "string" }
          - { label: "Evento 1 - descripción", name: "event1Description", widget: "text" }
          - { label: "Evento 1 - fecha", name: "event1Date", widget: "string" }
          - { label: "Evento 2 - título", name: "event2Title", widget: "string" }
          - { label: "Evento 2 - descripción", name: "event2Description", widget: "text" }
          - { label: "Evento 2 - fecha", name: "event2Date", widget: "string" }
          - { label: "Evento 3 - título", name: "event3Title", widget: "string" }
          - { label: "Evento 3 - descripción", name: "event3Description", widget: "text" }
          - { label: "Evento 4 - título", name: "event4Title", widget: "string" }
          - { label: "Evento 4 - descripción", name: "event4Description", widget: "text" }
          - { label: "Etiqueta del artículo destacado", name: "featuredArticleLabel", widget: "string" }
          - { label: "Título del artículo destacado", name: "featuredArticleTitle", widget: "string" }
          - { label: "Resumen del artículo destacado", name: "featuredArticleSummary", widget: "text" }
          - { label: "Categoría del artículo destacado", name: "featuredArticleCategory", widget: "string" }
          - { label: "Fecha del artículo destacado", name: "featuredArticleDate", widget: "string" }
          - { label: "Nota del artículo destacado", name: "featuredArticleNote", widget: "text" }
          - { label: "Botón del artículo destacado", name: "featuredArticleCta", widget: "string" }
          - { label: "Título de otros artículos", name: "otherArticlesHeading", widget: "string" }
          - { label: "Artículo 1 - título", name: "otherArticle1Title", widget: "string" }
          - { label: "Artículo 1 - descripción", name: "otherArticle1Description", widget: "text" }
          - { label: "Artículo 2 - título", name: "otherArticle2Title", widget: "string" }
          - { label: "Artículo 2 - descripción", name: "otherArticle2Description", widget: "text" }
          - { label: "Artículo 3 - título", name: "otherArticle3Title", widget: "string" }
          - { label: "Artículo 3 - descripción", name: "otherArticle3Description", widget: "text" }
          - { label: "Artículo 4 - título", name: "otherArticle4Title", widget: "string" }
          - { label: "Artículo 4 - descripción", name: "otherArticle4Description", widget: "text" }
          - { label: "Botón de otros artículos", name: "otherArticlesCta", widget: "string" }
          - { label: "Etiqueta del podcast", name: "podcastLabel", widget: "string" }
          - { label: "Título del podcast", name: "podcastTitle", widget: "string" }
          - { label: "Descripción del podcast", name: "podcastDescription", widget: "text" }
          - { label: "Botón del podcast", name: "podcastCta", widget: "string" }
          - { label: "Título de contacto", name: "contactHeading", widget: "string" }
          - { label: "Teléfono", name: "contactPhone", widget: "string" }
          - { label: "Email", name: "contactEmail", widget: "string" }
          - { label: "Dirección", name: "contactAddress", widget: "string" }
          - { label: "Horario", name: "contactHours", widget: "string" }

          - label: "Tarjetas de servicios y eventos"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto alternativo de imagen", name: "imageAlt", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Fecha u horario", name: "date", widget: "string", required: false }
