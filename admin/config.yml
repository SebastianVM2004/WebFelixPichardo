backend:
  name: git-gateway
  branch: main

media_folder: "static/images"
public_folder: "/static/images"

publish_mode: editorial_workflow

collections:
  - label: "Página de inicio"
    name: "home"
    files:
      - label: "Contenido de la página de inicio"
        name: "home"
        file: "content/home.json"
        fields:
          - { label: "Título del sitio", name: "siteTitle", widget: "string" }
          - { label: "Texto de bienvenida", name: "textoentrada", widget: "markdown" }
          - { label: "Imagen del autor", name: "imagenautor", widget: "image", required: false }
          - { label: "Título del libro destacado", name: "bookHeading", widget: "string" }
          - { label: "Descripción del libro", name: "bookDescription", widget: "text" }
          - { label: "Título del autor", name: "authorHeading", widget: "string" }
          - { label: "Nombre del autor", name: "authorName", widget: "string" }
          - { label: "Descripción del autor", name: "authorDescription", widget: "text" }
          - { label: "Servicios del autor", name: "authorServices", widget: "text" }
          - { label: "Título de eventos", name: "eventsHeading", widget: "string" }
          - { label: "Descripción de eventos", name: "eventsDescription", widget: "text" }
          - { label: "Etiqueta del artículo destacado", name: "featuredArticleLabel", widget: "string" }
          - { label: "Título del artículo destacado", name: "featuredArticleTitle", widget: "string" }
          - { label: "Resumen del artículo destacado", name: "featuredArticleSummary", widget: "text" }
          - { label: "Categoría del artículo destacado", name: "featuredArticleCategory", widget: "string" }
          - { label: "Fecha del artículo destacado", name: "featuredArticleDate", widget: "string" }
          - { label: "Nota del artículo destacado", name: "featuredArticleNote", widget: "text" }
          - { label: "Botón del artículo destacado", name: "featuredArticleCta", widget: "string" }
          - { label: "Título de otros artículos", name: "otherArticlesHeading", widget: "string" }
          - { label: "Artículo 1 - título", name: "otherArticle1Title", widget: "string" }
          - { label: "Artículo 1 - descripción", name: "otherArticle1Description", widget: "text" }
          - { label: "Artículo 2 - título", name: "otherArticle2Title", widget: "string" }
          - { label: "Artículo 2 - descripción", name: "otherArticle2Description", widget: "text" }
          - { label: "Artículo 3 - título", name: "otherArticle3Title", widget: "string" }
          - { label: "Artículo 3 - descripción", name: "otherArticle3Description", widget: "text" }
          - { label: "Artículo 4 - título", name: "otherArticle4Title", widget: "string" }
          - { label: "Artículo 4 - descripción", name: "otherArticle4Description", widget: "text" }
          - { label: "Botón de otros artículos", name: "otherArticlesCta", widget: "string" }
          - { label: "Etiqueta del podcast", name: "podcastLabel", widget: "string" }
          - { label: "Título del podcast", name: "podcastTitle", widget: "string" }
          - { label: "Descripción del podcast", name: "podcastDescription", widget: "text" }
          - { label: "Botón del podcast", name: "podcastCta", widget: "string" }
          - label: "Tarjetas de servicios"
            name: "services"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Imagen", name: "image", widget: "image" }
              - { label: "Texto alternativo", name: "imageAlt", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Fecha u horario", name: "date", widget: "string", required: false }

  - label: "Artículos"
    name: "articles"
    files:
      - label: "Contenido de artículos"
        name: "articles"
        file: "content/articles.json"
        fields:
          - { label: "Título de la sección", name: "articlesHeading", widget: "string" }
          - { label: "Descripción de la sección", name: "articlesDescription", widget: "text" }
          - label: "Artículos"
            name: "articles"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Imagen", name: "image", widget: "image", required: false }
              - { label: "Texto alternativo", name: "imageAlt", widget: "string", required: false }
              - { label: "Categoría", name: "category", widget: "string" }
              - { label: "Identificador de URL", name: "slug", widget: "string" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Contenido completo", name: "body", widget: "markdown" }

  - label: "Catálogo"
    name: "catalog"
    files:
      - label: "Contenido del catálogo"
        name: "catalog"
        file: "content/catalog.json"
        fields:
          - { label: "Título del catálogo", name: "catalogTitle", widget: "string" }
          - { label: "Placeholder de búsqueda", name: "catalogSearchPlaceholder", widget: "string" }
          - { label: "Título del carrito", name: "cartHeading", widget: "string" }
          - { label: "Botón proceder al pago", name: "checkoutButton", widget: "string" }
          - { label: "Botón limpiar carrito", name: "clearCartButton", widget: "string" }
          - label: "Productos"
            name: "products"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nombre", name: "name", widget: "string" }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Precio", name: "price", widget: "number", value_type: "float", min: 0 }
              - { label: "Categoría", name: "category", widget: "string" }
              - { label: "Ícono", name: "emoji", widget: "string", required: false }

  - label: "Conferencias"
    name: "conferences"
    files:
      - label: "Contenido de conferencias"
        name: "conferences"
        file: "content/conferences.json"
        fields:
          - { label: "Título de la sección", name: "conferencesHeading", widget: "string" }
          - { label: "Descripción de la sección", name: "conferencesDescription", widget: "text" }
          - label: "Conferencias"
            name: "conferences"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Ponente", name: "speaker", widget: "string" }
              - { label: "Fecha", name: "date", widget: "string" }
              - { label: "Lugar", name: "location", widget: "string", required: false }
              - { label: "Descripción", name: "description", widget: "text" }
              - { label: "Imagen", name: "image", widget: "image", required: false }

  - label: "Contacto"
    name: "contact"
    files:
      - label: "Contenido de contacto"
        name: "contact"
        file: "content/contact.json"
        fields:
          - { label: "Título de la página", name: "contactPageHeading", widget: "string" }
          - { label: "Título del bloque", name: "contactHeading", widget: "string" }
          - { label: "Teléfono", name: "contactPhone", widget: "string" }
          - { label: "Email", name: "contactEmail", widget: "string" }
          - { label: "Dirección", name: "contactAddress", widget: "string" }
          - { label: "Horario", name: "contactHours", widget: "string" }
          - label: "Información detallada"
            name: "contactInfo"
            widget: "object"
            fields:
              - { label: "Dirección", name: "address", widget: "text" }
              - { label: "Teléfono", name: "phone", widget: "text" }
              - { label: "Correo", name: "email", widget: "text" }
              - { label: "Título del formulario", name: "formHeading", widget: "string" }
              - { label: "Título de redes", name: "socialHeading", widget: "string" }
